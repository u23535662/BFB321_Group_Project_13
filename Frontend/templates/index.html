<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <!-- insert here -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img src="../images/Stanway-Logo-picture.png" class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames active">
          <a href="index.html" class="noto-sans-display-page page_active"
            ><div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="stock.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="pricelists.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Pricelist
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="suppliers.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div></a
          >
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h3 class="noto-sans-display-h1">Account</h3>
      </div>
    </nav>

    <!-- NAV BAR END -->
    <!-- OVERVIEW BLOCKS START -->

    <div class="overviewblocks">
      <div class="blocktodo">
        <div class="headingblocktodo">
          <h2>To do</h2>
        </div>
        <div class="contentblocktodo">
          <div class="task_block">
            <div class="task_block_left">
              <div class="task_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="task_title">Task</h3>
            </div>
          </div>
          <!-- FILLER START -->
          <div class="task_block">
            <div class="task_block_left">
              <div class="task_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="task_title">Task</h3>
            </div>
          </div>
          <!-- FILLER END -->
        </div>
      </div>
      <div class="blockproducts">
        <div class="headingblockproducts">
          <h2>Products</h2>
        </div>
        <div class="contentblockproducts">
          <div class="productname_block">
            <div class="productname_block_left">
              <div class="productname_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="productname_title">Product Name</h3>
            </div>
          </div>
          <!-- FILLER START -->
          <div class="productname_block">
            <div class="productname_block_left">
              <div class="productname_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="productname_title">Product Name</h3>
            </div>
          </div>
          <!-- FILLER END -->
        </div>
      </div>
      <!-- FREQUENT SUPPS END -->

      <div class="blockbuttons">
        <div class="buttons_block">
          <div class="buttons_block_right">
            <h3 class="buttons_title">Buttons?</h3>
          </div>
        </div>
      </div>
      <div class="blockgraphs">
        <div class="headingblockgraphs">
          <h2>Bar Chart</h2>
        </div>
        <div class="contentgraphs">
          <!-- FILLER GRAPH IMG - WILL BE AN ACTUAL GRAPH IN FINAL -->
          <img class="graph_img" src="../images/graph.jpg" />
        </div>
        <div class="headingblockgraphs">
          <h2>EOQ Graph</h2>
        </div>
        <div class="contentgraphs">
          <!-- FILLER GRAPH IMG - WILL BE AN ACTUAL GRAPH IN FINAL -->
          <img class="graph_img" src="../images/graph.jpg" />
        </div>        
      </div>      
    </div>
    <!-- OVERVIEW BLOCKS END -->

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
