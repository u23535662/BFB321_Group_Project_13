<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <!-- insert here -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img src="../images/Stanway-Logo-picture.png" class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames">
          <a href="index.html" class="noto-sans-display-page active"
            ><div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div></a
          >
        </li>
        <li class="pagenames active">
          <a href="stock.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="pricelists.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Pricelist
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="suppliers.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div></a
          >
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h1 class="noto-sans-display-h1">Account</h1>
      </div>
    </nav>

    <!-- NAV BAR END -->

    <!-- STOCK BLOCKS START -->
    <div class="stockblocks">
      <div class="stockBtns">
        <button id="stockButton1" class="stockbutton1">Button 1</button>
        <button id="stockButton2" class="stockbutton2">Button 2</button>
      </div>

      <div class="blocksuppliersmain">
        <div class="supp_list_item">
          <div class="supplier_item">
            <div class="list_item_left">
              <div class="list_item_icon">XX</div>
              <p class="list_item_title">Supplier name</p>
            </div>
            <button class="list_item_button">View</button>
          </div>
          <div class="supplier_item_expanded_content">
            <div class="expanded_searchbutt">
              <input class="searchbar" type="text" placeholder="Search..." />
              <div class="others">
                <button class="filterbutt"></button>
                <button class="clearbutt"></button>
              </div>
            </div>
            <div class="expanded_description">
              <div class="info">
                
              </div>
              <button class="editbutt"></button>
            </div>
            <div class="expanded_values"></div>
          </div>
        </div>
      </div>
      <div class="blocklowstock">
        <div class="headingblockstock"></div>
        <div class="contentblockstock"></div>
      </div>
    </div>

    <!-- STOCK BLOCKS END -->

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </body>
</html>
