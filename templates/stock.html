<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Management | Stanway</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../static/css/stock_style.css" />
  </head>

  <body>
    <!-- NAV BAR START -->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img
            src="../static/images/Stanway-Logo-picture.png"
            alt="Stanway Logo"
            class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames">
          <a href="index.html" class="noto-sans-display-page">
            <div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div>
          </a>
        </li>
        <li class="pagenames active">
          <a href="stock.html" class="noto-sans-display-page page_active">
            <div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div>
          </a>
        </li>
        <li class="pagenames">
          <a href="order.html" class="noto-sans-display-page">
            <div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Orders
            </div>
          </a>
        </li>
        <li class="pagenames">
          <a href="suppliers.html" class="noto-sans-display-page">
            <div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div>
          </a>
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h3 class="noto-sans-display-h1">Account</h3>
      </div>
    </nav>
    <!-- NAV BAR END -->

    <!-- STOCK BLOCKS START -->
    <div class="stockblocks">
      <div class="salesOrderBtn">
        <i data-lucide="circle-plus"></i>
        <p>New Sales Order</p>
      </div>
      <div class="stockBtns">
        <!-- Add Item Button -->
        <button id="stockButton1" class="stockbutton1">
          <div class="new_item_icon">
            <i data-lucide="circle-plus"></i>
          </div>
          <div class="new_item_text">New Item</div>
        </button>

        <!-- Delete Item Button -->
        <button type="button" id="stockButton2" class="stockbutton2">
          <div class="delete_item_icon">
            <i data-lucide="circle-x"></i>
          </div>
          <div class="delete_item_text">Delete Item</div>
        </button>
      </div>

      <!-- SALES ORDER POPUP START -->
      <div class="sales_background" id="sales_background">
        <div class="sales_content">
          <div class="sales_heading">
            <h1>New Sales Order</h1>
          </div>
          <div class="scroll_sales" id="scroll_sales">
            <div class="prodd_unitt" id="prodd_unitt">
              <select
                name="Product"
                id="prodd"
                class="prodd"
                placeholder="Product...">
                <option value="" disabled selected hidden>
                  Select a Product...
                </option>
              </select>
              <input type="text" class="unitt" placeholder="Units" />
            </div>
          </div>

          <div class="confirmAndcancel">
            <button class="add_prod" id="add_product" type="button">
              <i data-lucide="circle-plus"></i>
              <p>Add Product</p>
            </button>
            <div class="conff" id="conff">
              <p>Confirm</p>
            </div>
            <div class="cancc" id="cancc">
              <p>Cancel</p>
            </div>
          </div>
        </div>
      </div>

      <!-- SALES ORDER POPUP END -->

      <!-- Add Product Modal -->
      <div
        id="addProductModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="addModalTitle">
        <div class="modal-content">
          <span
            class="close"
            id="close_stock_popup"
            role="button"
            tabindex="0"
            aria-label="Close modal">
            <i data-lucide="circle-x"></i>
          </span>
          <div class="popup_name">
            <h1>Add New Product</h1>
          </div>

          <form id="addProductForm" novalidate>
            <input
              id="addProdName"
              class="addProd"
              type="text"
              placeholder="Product name..."
              required />

            <select id="addSuppSelect" class="addSupp" required>
              <option value="">Select a supplier...</option>
            </select>

            <input
              id="addProdUnits"
              class="addUnits"
              type="number"
              min="0"
              step="1"
              placeholder="Units in Stock..."
              required />

            <input
              id="addProdPrice"
              class="addUnits"
              type="number"
              min="0"
              step="0.01"
              placeholder="Unit Price" />

            <input
              id="addProdHoldingCost"
              class="addUnits"
              type="number"
              min="0"
              step="0.01"
              placeholder="Holding Cost" />

            <p class="popup-status text" style="display: none"></p>
            <button type="submit" class="submit_popup">Submit</button>
          </form>
        </div>
      </div>

      <!-- Edit stock popup start -->
      <div class="edit_background" id="edit_background">
        <div class="edit_content">
          <div class="edit_heading">
            <h1>Edit Product</h1>
          </div>
          <div class="edit_content">
            <select class="sel_product"></select>
            <input />
            <input />
            <input />
          </div>

          <div class="confirmAndcancel">
            <div class="conff">
              <p>Confirm</p>
            </div>
            <div class="cancc">
              <p>Cancel</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Edit stock popup end -->

      <!-- Delete Product Modal -->
      <div
        id="deleteProductModal"
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="deleteModalTitle">
        <div class="modal-content">
          <span
            class="close"
            id="close_delete_popup"
            role="button"
            tabindex="0"
            aria-label="Close modal">
            <i data-lucide="circle-x"></i>
          </span>
          <div class="popup_name">
            <h1 id="deleteModalTitle" class="popup_title">Delete Product</h1>
          </div>

          <form id="deleteProductForm" novalidate>
            <h3>Select Product To remove</h3>
            <select id="deleteProdSelect" class="addSupp" required>
              <option value="">Loading products...</option>
            </select>

            <p class="popup-status text" style="display: none"></p>
            <button
              type="submit"
              class="submit_popup"
              style="background-color: #c0392b">
              Delete Product
            </button>
          </form>
        </div>
      </div>

      <!-- Main Suppliers List -->
      <div class="blocksuppliersmain">
        <div id="suppliers_list">
          <p class="text">Loading suppliers...</p>
        </div>
      </div>

      <!-- Low Stock Panel -->
      <div class="blocklowstock">
        <div class="headingblockstock">
          <p>Low Stock Items</p>
        </div>
        <div id="low_stock_list" class="contentblockstock">
          <p class="text">Checking stock levels...</p>
        </div>
      </div>
    </div>
    <!-- STOCK BLOCKS END -->

    <!-- Icon & Base Scripts -->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../templates/script.js"></script>

    <!-- API Integration -->
    <script>
      // Store card controllers by supplierId so we can refresh them dynamically
      const supplierCardControllers = new Map();

      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      document.addEventListener("DOMContentLoaded", () => {
        refreshIcons();
        loadSuppliers();
        loadLowStockProducts();
        initAddProductModal();
        initDeleteProductModal();

        // Allow Escape key to close any open modal
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            document.querySelectorAll(".modal").forEach((modal) => {
              modal.style.display = "none";
            });
          }
        });
      });

      /* ---------------- ADD PRODUCT MODAL ---------------- */
      function initAddProductModal() {
        const modal = document.getElementById("addProductModal");
        const openBtn = document.getElementById("stockButton1");
        const closeBtn = document.getElementById("close_stock_popup");
        const form = document.getElementById("addProductForm");

        if (!modal || !openBtn || !closeBtn || !form) return;

        const prodInput = document.getElementById("addProdName");
        const suppSelect = document.getElementById("addSuppSelect");
        const unitsInput = document.getElementById("addProdUnits");
        const priceInput = document.getElementById("addProdPrice");
        const holdingCostInput = document.getElementById("addProdHoldingCost");
        const submitBtn = form.querySelector(".submit_popup");
        const statusEl = modal.querySelector(".popup-status");

        let suppliersLoaded = false;

        function setStatus(message, isError = false) {
          statusEl.style.display = message ? "block" : "none";
          statusEl.textContent = message;
          statusEl.style.color = isError ? "#c0392b" : "#27ae60";
        }

        function resetForm() {
          form.reset();
          setStatus("");
        }

        function closeModal() {
          modal.style.display = "none";
          setStatus("");
        }

        async function populateSuppliers(forceReload = false) {
          if (suppliersLoaded && !forceReload) return;

          suppSelect.innerHTML = `<option value="">Loading suppliers...</option>`;
          suppSelect.disabled = true;

          try {
            const response = await fetch("/api/suppliers");
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const payload = await response.json();
            const suppliers = Array.isArray(payload)
              ? payload
              : payload.data || [];

            suppSelect.innerHTML = `<option value="">Select a supplier...</option>`;
            suppliers.forEach((supplier) => {
              const option = document.createElement("option");
              option.value = supplier.id ?? supplier.supplier_id ?? "";
              option.textContent =
                supplier.name ?? supplier.supplier_name ?? "Unnamed Supplier";
              suppSelect.appendChild(option);
            });

            suppliersLoaded = true;
          } catch (error) {
            console.error("Failed to load suppliers for modal:", error);
            suppSelect.innerHTML = `<option value="">Failed to load suppliers</option>`;
            setStatus("Could not load suppliers list.", true);
          } finally {
            suppSelect.disabled = false;
          }
        }

        openBtn.addEventListener("click", () => {
          resetForm();
          modal.style.display = "block";
          populateSuppliers();
          prodInput.focus();
        });

        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();

          const name = prodInput.value.trim();
          const supplierId = suppSelect.value;
          const units = Number(unitsInput.value);
          const price = Number(priceInput.value || 0);
          const holdingCost = Number(holdingCostInput.value || 0);

          if (!name) return setStatus("Please enter a product name.", true);
          if (!supplierId) return setStatus("Please select a supplier.", true);
          if (unitsInput.value === "" || Number.isNaN(units) || units < 0) {
            return setStatus("Please enter a valid number of units.", true);
          }
          if (
            Number.isNaN(price) ||
            price < 0 ||
            Number.isNaN(holdingCost) ||
            holdingCost < 0
          ) {
            return setStatus(
              "Price and holding cost must be 0 or greater.",
              true,
            );
          }

          submitBtn.disabled = true;
          setStatus("Saving product...", false);

          try {
            const normalizedSupplierId = Number.isNaN(Number(supplierId))
              ? supplierId
              : Number(supplierId);
            const body = {
              name,
              supplier_id: normalizedSupplierId,
              year_starting_inventory: Math.trunc(units),
              price,
              holding_cost: holdingCost,
            };

            const response = await fetch("/api/products", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });

            const result = await response.json();
            if (!response.ok || !result.success) {
              throw new Error(result.error || `HTTP ${response.status}`);
            }

            setStatus("Product added successfully!", false);

            // Refresh low stock list and the affected supplier's product list
            loadLowStockProducts();
            const controller = supplierCardControllers.get(
              String(normalizedSupplierId),
            );
            if (controller) {
              controller.refresh();
            }

            setTimeout(closeModal, 600);
          } catch (error) {
            console.error("Error creating product:", error);
            setStatus(error.message || "Failed to add product.", true);
          } finally {
            submitBtn.disabled = false;
          }
        });
      }

      /* ---------------- DELETE PRODUCT MODAL ---------------- */
      function initDeleteProductModal() {
        const modal = document.getElementById("deleteProductModal");
        const openBtn = document.getElementById("stockButton2");
        const closeBtn = document.getElementById("close_delete_popup");
        const form = document.getElementById("deleteProductForm");

        if (!modal || !openBtn || !closeBtn || !form) return;

        const prodSelect = document.getElementById("deleteProdSelect");
        const submitBtn = form.querySelector(".submit_popup");
        const statusEl = modal.querySelector(".popup-status");

        function setStatus(message, isError = false) {
          statusEl.style.display = message ? "block" : "none";
          statusEl.textContent = message;
          statusEl.style.color = isError ? "#c0392b" : "#27ae60";
        }

        function closeModal() {
          modal.style.display = "none";
          setStatus("");
        }

        async function populateProducts() {
          prodSelect.innerHTML = `<option value="">Loading products...</option>`;
          prodSelect.disabled = true;

          try {
            const response = await fetch("/api/products");
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const payload = await response.json();
            const products = Array.isArray(payload)
              ? payload
              : payload.data || [];

            prodSelect.innerHTML = `<option value="">Select a product...</option>`;
            products.forEach((product) => {
              const option = document.createElement("option");
              option.value = product.id;
              option.dataset.supplierId = product.supplier_id ?? "";
              option.textContent = `${product.name} (${product.current_inventory ?? 0} in stock)`;
              prodSelect.appendChild(option);
            });
          } catch (error) {
            console.error("Failed to load products for deletion:", error);
            prodSelect.innerHTML = `<option value="">Failed to load products</option>`;
            setStatus("Could not load products.", true);
          } finally {
            prodSelect.disabled = false;
          }
        }

        openBtn.addEventListener("click", () => {
          setStatus("");
          modal.style.display = "block";
          populateProducts();
        });

        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", (e) => {
          if (e.target === modal) closeModal();
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const productId = prodSelect.value;
          const selectedOption = prodSelect.options[prodSelect.selectedIndex];
          const supplierId = selectedOption?.dataset.supplierId;

          if (!productId)
            return setStatus("Please select a product to delete.", true);

          submitBtn.disabled = true;
          setStatus("Deleting product...", false);

          try {
            const response = await fetch(
              `/api/products/${encodeURIComponent(productId)}`,
              {
                method: "DELETE",
              },
            );

            const result = await response.json().catch(() => ({}));
            if (!response.ok || result.success === false) {
              throw new Error(result.error || `HTTP ${response.status}`);
            }

            setStatus("Product deleted.", false);
            loadLowStockProducts();

            if (supplierId && supplierCardControllers.has(String(supplierId))) {
              supplierCardControllers.get(String(supplierId)).refresh();
            } else {
              // Refresh any open supplier cards if supplierId wasn't returned on /api/products
              supplierCardControllers.forEach((ctrl) => ctrl.refreshIfOpen());
            }

            setTimeout(closeModal, 600);
          } catch (error) {
            console.error("Error deleting product:", error);
            setStatus(error.message || "Failed to delete product.", true);
          } finally {
            submitBtn.disabled = false;
          }
        });
      }

      /* ---------------- SUPPLIERS & PRODUCTS ---------------- */
      async function loadSuppliers() {
        const container = document.getElementById("suppliers_list");
        if (!container) return;

        container.innerHTML = `<p class="text">Loading suppliers...</p>`;
        supplierCardControllers.clear();

        try {
          const response = await fetch("/api/suppliers");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const payload = await response.json();
          const suppliers = Array.isArray(payload)
            ? payload
            : payload.data || [];

          if (suppliers.length === 0) {
            container.innerHTML = `<p class="text">No suppliers found.</p>`;
            return;
          }

          container.innerHTML = "";
          suppliers.forEach((supplier) => {
            const card = createSupplierCard(supplier);
            container.appendChild(card);
          });

          refreshIcons();
        } catch (error) {
          console.error("Error fetching suppliers:", error);
          container.innerHTML = `<p class="text">Failed to load suppliers.</p>`;
        }
      }

      function createSupplierCard(supplier) {
        const supplierId = supplier.id ?? supplier.supplier_id;
        const supplierName =
          supplier.name ?? supplier.supplier_name ?? "Unnamed Supplier";

        const itemEl = document.createElement("div");
        itemEl.className = "supp_list_item";
        itemEl.dataset.supplierId = supplierId;

        itemEl.innerHTML = `
          <div class="supplier_item">
            <div class="list_item_left">
              <div class="list_item_icon">
                <i data-lucide="users-round"></i>
              </div>
              <p class="list_item_title"></p>
            </div>
            <button type="button" class="list_item_button" aria-expanded="false" aria-label="Toggle supplier products">
              <i data-lucide="chevron-up" class="open_list"></i>
              <i data-lucide="chevron-down" class="close_list"></i>
            </button>
          </div>
          <div class="supplier_item_expanded_content hidden">
            <div class="expanded_searchbutt">
              <input class="searchbar" type="text" placeholder="Search products..." />
              <div class="others">
                
                <button type="button" class="clearbutt" aria-label="Clear search">
                  <i data-lucide="funnel-x"></i>
                </button>
              </div>
            </div>
            <div class="expanded_description">
              <div class="info">
                <div class="units">
                <p>Units</p>
                </div>
                <div class="sold">
                <p>Sold this month</p>
                </div>
                <div class="products">
                <p>Product</p>
                </div>
                
                <div class="warning">
                  <p>Warning</p>
                </div>
                <div class="location">
                  <p>Location</p>
                </div>
              </div>
              <button class="editbutt">
                <i data-lucide="pencil"></i>
              </button>
            </div>
            <div class="expanded_values product-list">
              <div class="text product-loading-status">Fetching data ...</div>
            </div>
          </div>
        `;

        itemEl.querySelector(".list_item_title").textContent = supplierName;

        const toggleBtn = itemEl.querySelector(".list_item_button");
        const expandedContent = itemEl.querySelector(
          ".supplier_item_expanded_content",
        );
        const openListIcon = itemEl.querySelector(".open_list");
        const closeListIcon = itemEl.querySelector(".close_list");
        const searchInput = itemEl.querySelector(".searchbar");
        const filterBtn = itemEl.querySelector(".filterbutt");
        const clearBtn = itemEl.querySelector(".clearbutt");

        let hasLoaded = false;
        let cachedProducts = [];

        async function loadAndRenderProducts() {
          hasLoaded = true;
          cachedProducts = await fetchSupplierProducts(itemEl, supplierId);
          applyFilter();
        }

        toggleBtn?.addEventListener("click", () => {
          const isOpening = expandedContent.classList.contains("hidden");

          expandedContent.classList.toggle("hidden");
          openListIcon?.classList.toggle("hidden");
          closeListIcon?.classList.toggle("unhide");
          toggleBtn.setAttribute("aria-expanded", String(isOpening));

          if (isOpening && !hasLoaded && supplierId != null) {
            loadAndRenderProducts();
          }
        });

        function applyFilter() {
          const term = (searchInput?.value || "").trim().toLowerCase();
          if (!term) {
            renderSupplierProducts(itemEl, cachedProducts);
            return;
          }
          const filtered = cachedProducts.filter((product) =>
            String(product.name ?? "")
              .toLowerCase()
              .includes(term),
          );
          renderSupplierProducts(itemEl, filtered);
        }

        filterBtn?.addEventListener("click", applyFilter);
        searchInput?.addEventListener("input", applyFilter);
        searchInput?.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            applyFilter();
          }
        });

        clearBtn?.addEventListener("click", () => {
          if (searchInput) searchInput.value = "";
          renderSupplierProducts(itemEl, cachedProducts);
        });

        // Register controller for external cache invalidation/refresh
        if (supplierId != null) {
          supplierCardControllers.set(String(supplierId), {
            refresh: () => {
              if (!expandedContent.classList.contains("hidden")) {
                loadAndRenderProducts();
              } else {
                hasLoaded = false; // Force reload next time it's opened
              }
            },
            refreshIfOpen: () => {
              if (!expandedContent.classList.contains("hidden")) {
                loadAndRenderProducts();
              } else {
                hasLoaded = false;
              }
            },
          });
        }

        return itemEl;
      }

      function setProductListStatus(listEl, message, isVisible = true) {
        let statusEl = listEl.querySelector(".product-loading-status");
        if (!statusEl) {
          listEl.insertAdjacentHTML(
            "beforeend",
            `<div class="text product-loading-status"></div>`,
          );
          statusEl = listEl.querySelector(".product-loading-status");
        }
        statusEl.style.display = isVisible ? "" : "none";
        statusEl.textContent = message;
      }

      function renderSupplierProducts(itemEl, products) {
        const listEl = itemEl.querySelector(".product-list");
        if (!listEl) return;

        listEl.querySelectorAll(".product-row").forEach((row) => row.remove());

        if (!Array.isArray(products) || products.length === 0) {
          setProductListStatus(listEl, "No products found", true);
          return;
        }

        setProductListStatus(listEl, "", false);

        const rowsHtml = products
          .map(
            (product) => `
              <div class="text product-row">
                <div class="text">
                  <p class="text">${escapeHtml(product.current_inventory ?? 0)}</p>
                  <p class="text t2">${escapeHtml(product.name ?? "")}</p>
                  <p class="text t1">${escapeHtml(product.sold ?? 0)}</p>
                </div>
              </div>
            `,
          )
          .join("");

        listEl.insertAdjacentHTML("beforeend", rowsHtml);
      }

      async function fetchSupplierProducts(itemEl, supplierId) {
        const listEl = itemEl.querySelector(".product-list");
        if (!listEl) return [];

        listEl.querySelectorAll(".product-row").forEach((row) => row.remove());
        setProductListStatus(listEl, "Fetching data ...", true);

        try {
          const url = `/api/suppliers/${encodeURIComponent(supplierId)}/products`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const payload = await response.json();
          const products =
            payload.success && Array.isArray(payload.data?.products_data)
              ? payload.data.products_data
              : Array.isArray(payload.data)
                ? payload.data
                : [];

          renderSupplierProducts(itemEl, products);
          return products;
        } catch (error) {
          console.error(
            `Error fetching products for supplier ${supplierId}:`,
            error,
          );
          setProductListStatus(listEl, "Failed to load products.", true);
          return [];
        }
      }

      /* ---------------- LOW STOCK PANEL ---------------- */
      async function loadLowStockProducts() {
        const listBlock = document.getElementById("low_stock_list");
        if (!listBlock) return;

        listBlock.innerHTML = `<p class="text">Checking stock levels...</p>`;

        try {
          const response = await fetch("/api/products");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const payload = await response.json();
          const products = Array.isArray(payload)
            ? payload
            : payload.data || [];

          const lowStockProducts = products.filter((item) => {
            const currentInv = Number(item.current_inventory);
            const rop = Number(item.rop);
            return (
              !Number.isNaN(currentInv) &&
              !Number.isNaN(rop) &&
              currentInv <= rop
            );
          });

          listBlock.innerHTML = "";

          if (lowStockProducts.length === 0) {
            listBlock.innerHTML = `<p class="text">No low-stock products.</p>`;
            return;
          }

          listBlock.innerHTML = lowStockProducts
            .map(
              (product) => `
                <div class="lowstockitem" data-product-id="${escapeHtml(product.id ?? "")}">
                  <p class="text">${escapeHtml(product.name ?? "Unnamed Product")}</p>
                  <p class="text">${escapeHtml(product.current_inventory ?? 0)}</p>
                </div>
              `,
            )
            .join("");
        } catch (error) {
          console.error("Error loading low-stock products:", error);
          listBlock.innerHTML = `<p class="text low-stock-status">Failed to load stock data.</p>`;
        }
      }
    </script>

    <script>
      //  SALES ORDER POPUP START

      const scroll_sales = document.getElementById("scroll_sales");
      const add_product = document.getElementById("add_product");
      add_product.addEventListener("click", () => {
        const div1 = document.createElement("div");
        div1.className = "prodd_unitt";

        const div2 = document.createElement("p");
        div2.textContent = "Delete";

        const divselect = document.createElement("select");
        divselect.className = "prodd";
        divselect.placeholder = "Product...";

        const divinput = document.createElement("input");
        divinput.className = "unitt";
        divinput.type = "number";
        divinput.step = "1";
        divinput.min = "0";
        divinput.placeholder = "Units";

        const divdelete = document.createElement("button");
        divdelete.className = "cancc";
        divdelete.addEventListener("click", () => {
          div1.remove();
        });
        divdelete.append(div2);
        div1.append(divselect, divinput, divdelete);
        scroll_sales.append(div1);
        return scroll_sales;
      });
      // SALES ORDER POPUP
    </script>
  </body>
</html>
