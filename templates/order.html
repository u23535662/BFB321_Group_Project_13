<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <!-- insert here -->
    <link rel="stylesheet" href="../static/css/order_style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img
            src="../static/images/Stanway-Logo-picture.png"
            class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames">
          <a href="index.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="stock.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div></a
          >
        </li>
        <li class="pagenames active">
          <a href="order.html" class="noto-sans-display-page page_active"
            ><div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Orders
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="suppliers.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div></a
          >
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h3 class="noto-sans-display-h1">Account</h3>
      </div>
    </nav>

    <!-- NAV BAR END -->

    <!-- ORDER BODY START-->
    <div class="order_body">
      <div class="order_topblock">
        <!-- NEW ORDER BUTTON START -->
        <button class="new_order_button" id="new_order_button">
          <i data-lucide="circle-plus"></i>
          <p class="new_order_text">New Order</p>
        </button>

        <!-- NEW ORDER BUTTON END -->
      </div>
      <div class="order_bodyblock">
        <!-- START OF ORDER LIST -->

        <!-- NOT EXPANDED START -->
        <div class="ordernumber_block">
          <div class="ordernumber_top">
            <div class="ordernumber_block_left">
              <div class="order_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="order_title">Unique Order Number</h3>
            </div>
            <button
              class="chevron_button"
              id="toggle_list_view_btn"
              onclick="toggleListView()">
              <i data-lucide="chevron-up" class="open_list"></i>
              <i data-lucide="chevron-down" class="close_list"></i>
            </button>
          </div>

          <!-- NOT EXPANDED END -->

          <!-- EXPANDED START -->
          <div class="order_expanded_content">
            <div class="supplier_for_order">
              <div class="supplier_left">
                <div class="supplier_icon">
                  <i data-lucide="users-round"></i>
                </div>
                <p class="list_item_title">Supplier name</p>
              </div>
            </div>
            <div class="expanded_headings">
              <div class="info">
                <div class="units">
                  <p>Units</p>
                </div>
                <div class="products">
                  <p>Products</p>
                </div>
                <div class="del_date">
                  <p>Estimated Delivery Date</p>
                </div>
              </div>
            </div>
            <div class="expanded_values">
              <div class="info">
                <div class="units">
                  <p>###</p>
                </div>
                <div class="products">
                  <p>Product</p>
                </div>
                <div class="del_date">
                  <p>###</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- EXPANDED END -->

        <!-- END OF ORDER LIST-->
      </div>
    </div>

    <!-- ORDER BODY END -->

    <!-- NEW ORDER POPUP START -->
    <div class="new_order_popup" id="new_order_popup">
      <div class="new_order_popup_content">
        <div class="add_new_order_heading">
          <h1>Add New Order</h1>
        </div>
        <div class="new_order_body">
          <div class="selectors">
            <div class="supplier_select">
              <select class="supplier_sel" name="supplier" id="supplier">
                <option value="" disabled selected hidden>
                  Select Supplier
                </option>
                <option value="supplier1">Supplier 1</option>
                <option value="supplier2">Supplier 2</option>
                <option value="supplier3">Supplier 3</option>
              </select>
            </div>
            <div class="product_and_unit_select">
              <div class="product_select">
                <select class="product_sel" name="product" id="product">
                  <option value="" disabled selected hidden>
                    Select Product
                  </option>
                  <option value="product1">Product 1</option>
                  <option value="product2">Product 2</option>
                  <option value="product3">Product 3</option>
                </select>
              </div>
              <div class="unit_select">
                <input
                  type="number"
                  class="unit_input"
                  name="units"
                  id="units"
                  placeholder="Units" />
              </div>
            </div>
          </div>

          <!-- NEW PRODUCT ADD START -->
          <div class="add_prod_hidden" id="add_prod_hidden">
            <div class="product_select" id="product_select">
              <select class="product_sel" name="product" id="product">
                <option
                  class="option"
                  id="option"
                  value=""
                  disabled
                  selected
                  hidden>
                  Select Product
                </option>
                <option value="product1">Product 1</option>
                <option value="product2">Product 2</option>
                <option value="product3">Product 3</option>
              </select>
            </div>
            <div class="unit_select">
              <input
                type="number"
                class="unit_input"
                name="units"
                id="units"
                placeholder="Units" />
            </div>
            <div class="prod_del" id="prod_del"></div>
          </div>

          <!-- NEW PRODUCT ADD END -->

          <div class="add_product" id="add_product">
            <div class="add_prod">
              <i data-lucide="circle-plus"></i>
              <p>Add Product</p>
            </div>
          </div>

          <div class="confirm_or_cancel_order">
            <div class="cancel" id="cancel">
              <p>Cancel</p>
            </div>
            <div class="confirm" id="confirm">
              <p>Confirm</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- NEW ORDER POPUP END -->

    <!-- ORDER CONFIRMED POPUP START -->
    <div class="confirm_background" id="confirm_background">
      <div class="confirm_message">
        <div class="top_x">
          <i class="x_confirm" id="x_confirm" data-lucide="circle-x"></i>
        </div>
        <h3>A new order has been confirmed</h3>
      </div>
    </div>

    <!-- ORDER CONFIRMED POPUP END -->

    <!-- SCRIPTS START -->

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- Script for expanding order -->
    <script>
      const toggleViewListBtn = document.getElementById("toggle_list_view_btn");

      if (toggleViewListBtn) {
        const orderExpandedContent = document.querySelector(
          ".order_expanded_content",
        );
        const openListIcon = document.querySelector(".open_list");
        const closeListIcon = document.querySelector(".close_list");

        // Toggle list view between open and close
        toggleViewListBtn.addEventListener("click", () => {
          orderExpandedContent.classList.toggle("hidden");
          openListIcon.classList.toggle("hidden");
          closeListIcon.classList.toggle("unhide");
        });
      }
    </script>

    <script>
      // Script for new order popup
      const orderOpenBtn = document.getElementById("new_order_button");
      const orderPopup = document.getElementById("new_order_popup");
      const orderCloseBtn = document.getElementById("cancel");

      if (orderOpenBtn && orderPopup && orderCloseBtn) {
        // Open Popup
        orderOpenBtn.addEventListener("click", function () {
          orderPopup.style.display = "flex";
        });

        // Close Popup
        orderCloseBtn.addEventListener("click", function () {
          orderPopup.style.display = "none";
        });

        // Close Popup (click outside)
        orderPopup.addEventListener("click", function (event) {
          if (event.target === orderPopup) {
            orderPopup.style.display = "none";
          }
        });
      } else if (!orderOpenBtn) {
        console.log("No open Button");
      } else if (!orderPopup) {
        console.log("No popup hold...");
      } else if (!orderCloseBtn) {
        console.log("No popup close");
      }

      // Script for confirm order popup
      const confirmOpenBtn = document.getElementById("confirm");
      const confirmPopup = document.getElementById("confirm_background");
      const confirmCloseBtn = document.getElementById("x_confirm");

      if (confirmOpenBtn && confirmPopup && confirmCloseBtn) {
        // Open Popup
        confirmOpenBtn.addEventListener("click", function () {
          orderPopup.style.display = "none";
          confirmPopup.style.display = "flex";
        });

        // Close Popup
        confirmCloseBtn.addEventListener("click", function () {
          confirmPopup.style.display = "none";
        });

        // Close Popup (click outside)
        confirmPopup.addEventListener("click", function (event) {
          if (event.target === confirmPopup) {
            confirmPopup.style.display = "none";
          }
        });
      } else if (!confirmOpenBtn) {
        console.log("No open Button");
      } else if (!confirmPopup) {
        console.log("No popup hold...");
      } else if (!confirmCloseBtn) {
        console.log("No popup close");
      }

      // ADD PRODUCT EXPANDING BUTTON START
      const hiddenProducts = document.getElementById("add_prod_hidden");

      const addProdBtn = document.getElementById("add_product");
      addProdBtn.addEventListener("click", (event) => {
        const prod_select = document.createElement("div");
        prod_select.id = "product_select";
        prod_select.className = "product_select";

        const product_sel = document.createElement("select");
        product_sel.className = "product_sel";
        product_sel.type = "select";

        const option = document.createElement("option");
        option.className = "option";
        option.type = "option";
        option.placeholder = "Select Product";

        const units = document.createElement("input");
        units.className = "units";
        units.type = "number";
        units.placeholder = "Units";

        const prod_del = document.createElement("div");
        prod_del.className = "prod_del";

        const cancelButton = document.createElement("div");
        cancelButton.className = "cancelButton";
        cancelButton.textContent = "Delete";
        cancelButton.addEventListener("click", () => {
          hiddenProducts.remove();
        });

        const childDiv4 = document.createElement("div");
        childDiv4.className = "delete_item_text";

        cancelButton.appendChild(childDiv4);
        addProdBtn.appendChild(prod_select);
        addProdBtn.appendChild(product_sel);
        addProdBtn.appendChild(option);
        addProdBtn.appendChild(units);
        addProdBtn.appendChild(prod_del);

        // parentDiv.appendChild(childDiv1);
        // parentDiv.appendChild(childDiv2);
        hiddenProducts.appendChild(prod_select);

        if (!addProdBtn) {
          console.log("No addProdBtn");
        } else if (!cancelButton) {
          console.log("no cancelButton");
        } else if (!hiddenProducts) {
          console.log("No hiddenProducts");
        } else if (!prod_select) {
          console.log("No prod_select");
        } else if (!product_sel) {
          console.log("No product_sel");
        } else if (!option) {
          console.log("No option");
        } else if (!units) {
          console.log("No units");
        } else if (!prod_del) {
          console.log("No prod_del");
        }
      });
      // ADD PRODUCT EXPANDING BUTTON END
    </script>

    <!-- SCRIPTS END -->
  </body>
</html>
