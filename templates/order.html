<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <!-- insert here -->
    <link rel="stylesheet" href="../static/css/order_style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img
            src="../static/images/Stanway-Logo-picture.png"
            class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames">
          <a href="index.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="stock.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div></a
          >
        </li>
        <li class="pagenames active">
          <a href="order.html" class="noto-sans-display-page page_active"
            ><div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Orders
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="suppliers.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div></a
          >
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h3 class="noto-sans-display-h1">Account</h3>
      </div>
    </nav>

    <!-- NAV BAR END -->
    <!-- ORDER BODY START-->
    <div class="order_body">
      <div class="order_topblock"></div>
      <div class="order_bodyblock">
        <!-- START OF ORDER LIST -->

        <!-- NOT EXPANDED START -->
        <div class="ordernumber_block">
          <div class="ordernumber_top">
            <div class="ordernumber_block_left">
              <div class="pl_icon">
                <i data-lucide="circle-dollar-sign"></i>
              </div>
              <h3 class="pl_title">Unique Order Number</h3>
            </div>
            <button
              class="chevron_button"
              id="toggle_list_view_btn"
              onclick="toggleListView()">
              <i data-lucide="chevron-up" class="open_list"></i>
              <i data-lucide="chevron-down" class="close_list"></i>
            </button>
          </div>

          <!-- NOT EXPANDED END -->

          <!-- EXPANDED START -->
          <div class="order_expanded_content">
            <div class="supplier_for_order">
              <div class="supplier_left">
                <div class="supplier_icon">
                  <i data-lucide="users-round"></i>
                </div>
                <p class="list_item_title">Supplier name</p>
              </div>
            </div>
            <div class="expanded_headings">
              <div class="info">
                <div class="units">
                  <p>Units</p>
                </div>
                <div class="products">
                  <p>Products</p>
                </div>
                <div class="del_date">
                  <p>Estimated Delivery Date</p>
                </div>
              </div>
            </div>
            <div class="expanded_values">
              <div class="info">
                <div class="units">
                  <p>###</p>
                </div>
                <div class="products">
                  <p>Product</p>
                </div>
                <div class="del_date">
                  <p>###</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- EXPANDED END -->

        <!-- END OF ORDER LIST-->
      </div>
    </div>
    <!-- PRICELIST BODY END -->

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
    <!-- <script src="../script.js"></script> -->
    <script src="../templates/script.js"></script>
  </body>
</html>
