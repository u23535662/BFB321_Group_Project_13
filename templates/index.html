    <!-- Script for icons-->

    <script>
      lucide.createIcons();
    </script>

    <!-- SCRIPT FOR ORDER POPUP -->

    <script>
      //Script for order popup
      const background = document.getElementById("todo_popup_background");
      const indexOpenBtn = document.getElementById("orderButton");
      const indexCloseBtn = document.getElementById("close_index_popup");

      if (background && indexOpenBtn && indexCloseBtn) {
        // Open Popup
        indexOpenBtn.addEventListener("click", function () {
          background.style.display = "flex";
        });

        // Close Popup
        indexCloseBtn.addEventListener("click", function () {
          background.style.display = "none";
        });

        // Close Popup (click outside)
        background.addEventListener("click", function (event) {
          if (event.target === background) {
            background.style.display = "none";
          }
        });
      } else if (!background) {
        console.log("No open Button");
      } else if (!indexOpenBtn) {
        console.log("No popup hold...");
      } else if (!indexCloseBtn) {
        console.log("No popup close");
      }

      // Script for confirm popup
      const confirmOpenBtn = document.getElementById("confirm_btn_popup");
      const confirmPopup = document.getElementById("confirm_btn_background");
      const confirmCloseBtn = document.getElementById("x_btn");

      if (confirmOpenBtn && confirmPopup && confirmCloseBtn) {
        // Open Popup
        confirmOpenBtn.addEventListener("click", function () {
          background.style.display = "none";
          confirmPopup.style.display = "flex";
        });

        // Close Popup
        confirmCloseBtn.addEventListener("click", function () {
          confirmPopup.style.display = "none";
        });

        // Close Popup (click outside)
        confirmPopup.addEventListener("click", function (event) {
          if (event.target === confirmPopup) {
            confirmPopup.style.display = "none";
          }
        });
      } else if (!confirmOpenBtn) {
        console.log("No open Button");
      } else if (!confirmPopup) {
        console.log("No popup hold...");
      } else if (!confirmCloseBtn) {
        console.log("No popup close");
      }
    </script>

    <!-- JSON DATA LOADING FOR PAGE -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        fetchALLProducts();
      });

      function fetchALLProducts() {
        // Calls /api/products
        fetch("/api/products")
          .then((response) => response.json())
          .then((products) => {
            const statusEL = document.getElementById("loading-status");
            const listEL = document.getElementById("product");

            if (
              !products.success ||
              !products.data ||
              products.data.length == 0
            ) {
              statusEL.innerText = "No products found";
              return;
            }

            statusEL.style.display = "none";
            listEL.innerHTML = "";

            products.data.forEach((product) => {
              const li = document.createElement("li");
              li.className = "product-item";
              li.innerHTML = `
              <div class="productname_block_left">  
                <div class="productname_icon">
                  <i data-lucide="circle-dollar-sign"></i>
                </div>
                <h3 class="productname_title">${product.name}\t${product.price}</h3>
              </div>`;
              listEL.appendChild(li);
            });
          })
          .catch((error) => {
            console.error("Error fetching data:", error);
            document.getElementById("loading-status").innerText =
              "Failed to load products.";
          });
      }
    </script>
