<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet" />
    <!-- insert here -->
    <link rel="stylesheet" href="../static/css/suppliers_style.css" />
  </head>

  <body>
    <!--NAV BAR START-->
    <nav class="navbar">
      <div class="logobox">
        <div class="logo">
          <img
            src="../static/images/Stanway-Logo-picture.png"
            class="logoimg" />
        </div>
        <i class="fa-solid fa-grip-lines"></i>
      </div>
      <ul class="navlist">
        <li class="pagenames">
          <a href="index.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-chart-line"></i>
              Overview
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="stock.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-boxes-packing"></i>
              Stock
            </div></a
          >
        </li>
        <li class="pagenames">
          <a href="order.html" class="noto-sans-display-page"
            ><div>
              <i class="fa-solid fa-hand-holding-dollar"></i>
              Orders
            </div></a
          >
        </li>
        <li class="pagenames active">
          <a href="suppliers.html" class="noto-sans-display-page page_active"
            ><div>
              <i class="fa-solid fa-truck-field"></i>
              Suppliers
            </div></a
          >
        </li>
      </ul>
      <div class="accountbox">
        <i class="fa-solid fa-circle-user"></i>
        <h3 class="noto-sans-display-h1">Account</h3>
      </div>
    </nav>
    <!-- NAV BAR END -->

    <!-- SUPPLIER BODY START -->
    <div class="supplier_body">
      <!-- SUPPLIER BUTTONS START -->
      <div class="supplierBtns">
        <button id="supplierButton1" class="supplierbutton1">
          <div class="new_item_icon">
            <i data-lucide="circle-plus"></i>
          </div>
          <div class="new_item_text">Add Supplier</div>
        </button>

        <!-- addSupplierModal start -->
        <div id="addSupplier" class="modal">
          <!-- Modal content -->
          <div class="modal-content">
            <span class="close" id="close_addSupplier_popup">
              <i data-lucide="circle-x"></i>
            </span>
            <div class="popup_name">
              <h3 class="popup_title">Add New Product</h3>
            </div>
            <div class="modal_details_block">
              <h3 class="block_title">General Details</h3>
              <input class="addSupplierName" type="text" placeholder="Supplier name..." />
              <h3 class="block_title">Contact Details</h3>
              <div class="modal_details_sub_block">
                <input class="addSupplierEmail" type="text" placeholder="Email adress..." />
                <input class="addSupplierTelephoneNumber" type="text" placeholder="Telephone number (optional)..." />
              </div>
            </div>

            <div>
              <button id="add_product_button" class="add_product">
                <div class="new_item_text">Add Product</div>
              </button>
              
              <ul class="add_ul" id="add_product_ul">
                <li class="add_li" id="add_product_li">

                </li>
              </ul>

              <script>
                const list = document.getElementById('add_product_li');

                const add_product = document.getElementById('add_product_button');
                add_product.addEventListener('click', (event) => {

                  const parentDiv = document.createElement('div');
                  parentDiv.id = 'container'
                  parentDiv.className = 'modal_details_block'

                  const childDiv1 = document.createElement('div');
                  childDiv1.className = 'modal_details_sub_block'

                  const input1 = document.createElement('input');
                  input1.className = 'addSupplierName'

                  const input2 = document.createElement('input');
                  input2.className = 'addSupplierEmail'

                  const childDiv2 = document.createElement('div');
                  childDiv2.className = 'modal_product_details_sub_block'

                  const input3 = document.createElement('input');
                  input3.className = 'addSupplierEmail'

                  const childDiv3 = document.createElement('div');
                  childDiv3.className = 'modal_submit_block'

                  const cancelButton = document.createElement('Button')
                  cancelButton.className = 'supplierbutton2'
                  cancelButton.addEventListener('click', () => {
                  parentDiv.remove();
                  })

                  const childDiv4 = document.createElement('div');
                  childDiv4.className = 'delete_item_text'

                  cancelButton.appendChild(childDiv4);
                  childDiv3.appendChild(cancelButton);
                  childDiv2.appendChild(input3);
                  childDiv2.appendChild(childDiv3);
                  childDiv1.appendChild(input1);
                  childDiv1.appendChild(input2);
                  parentDiv.appendChild(childDiv1);
                  parentDiv.appendChild(childDiv2);
                  list.appendChild(parentDiv);
                  })

              </script>
            </div>
            
            <div class="modal_submit_block">
              <span class="submit_popup">Submit</span>
            </div>
          </div>
        </div>
        <!-- addSupplierModal end -->
          
        <button id="supplierButton2" class="supplierbutton2">
          <div class="delete_item_icon">
            <i data-lucide="circle-x"></i>
          </div>
          <div class="delete_item_text">Delete Supplier</div>
        </button>
      </div>
      <!-- SUPPLIER BUTTONS END -->

      <div class="sup_topblock">
        <input class="sup_searchbar" type="text" placeholder="Search..." />
        <button class="filterbutt">
          <i data-lucide="funnel"></i>
        </button>
        <button class="clearbutt">
          <i data-lucide="funnel-x"></i>
        </button>
      </div>
      <div class="sup_bodyblock">
        <!-- BUTTON FOR PRICELIST - MAIN START -->
        <button id="sup_Block" class="sup_block">
          <div class="sup_Block_left">
            <div class="sup_icon">
              <i data-lucide="circle-dollar-sign"></i>
            </div>
            <h3 class="sup_title">Supplier Name</h3>
          </div>
        </button>
      </div>

      <!-- POPUP MODAL -->
      <div id="sup_popup_Hold" class="sup_popup_hold">
        <div class="sup_popup_content">
          <!-- CLOSE BUTTON -->
          <div class="sup_popup_top_bar">
            <div class="sup_popup_title">
              <h3>Supplier Name</h3>
            </div>
            <button id="close_sup" class="close_sup_popup">
              <i data-lucide="circle-x"></i>
            </button>
          </div>

          <!-- POPUP CONTENT -->
          <div class="sup_product_info">
            <div class="sup_info_left">
              <h3>Supplier Contact Details</h3>
            </div>
            <div class="sup_info_right">
              <div class="sup_info_display sup_prod_list">
                <div class="sup_prod_item">
                  <h3>Product Name</h3>
                </div>
                <div class="sup_prod_item">
                  <h3>Product Name</h3>
                </div>
                <div class="sup_prod_item">
                  <h3>Product Name</h3>
                </div>
                <div class="sup_prod_item">
                  <h3>Product Name</h3>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // SUPPLIERS PRICE LIST PAGE START
    const supOpenBtn = document.getElementById("sup_Block");
    const supPopup = document.getElementById("sup_popup_Hold");
    const supCloseBtn = document.getElementById("close_sup");

    if (supOpenBtn && supPopup && supCloseBtn) {
      // Open Popup
      supOpenBtn.addEventListener("click", function () {
        supPopup.style.display = "flex";
      });

      // Close Popup
      supCloseBtn.addEventListener("click", function () {
        supPopup.style.display = "none";
      });

      // Close Popup (click outside)
      supPopup.addEventListener("click", function (event) {
        if (event.target === supPopup) {
          supPopup.style.display = "none";
        }
      });
    } else if (!supOpenBtn) {
      console.log("No open Button");
    } else if (!supPopup) {
      console.log("No popup hold...");
    } else if (!supCloseBtn) {
      console.log("No popup close");
    }
    // SUPPLIERS PRICE LIST END
 
    // SUPPLIERS ADD MODAL START
    const addSupplierModal = document.getElementById("addSupplier");
    const addSupplierOpenBtn = document.getElementById("supplierButton1");
    const addSupplierCloseBtn = document.getElementById("close_addSupplier_popup");

    if (addSupplierModal && addSupplierOpenBtn && addSupplierCloseBtn) {
      // Open Popup
      addSupplierOpenBtn.addEventListener("click", function () {
        addSupplierModal.style.display = "block";
      });

      // Close Popup
      addSupplierCloseBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        addSupplierModal.style.display = "none";
      });

      // Close Popup (click outside)
      addSupplierModal.addEventListener("click", function (event) {
        if (event.target === addSupplierModal) {
          addSupplierModal.style.display = "none";
        }
      });
    }
    // SUPPLIERS ADD MODAL END
    </script>

    <!-- Script for icons-->
    <script
      src="https://kit.fontawesome.com/3000704a08.js"
      crossorigin="anonymous"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>

    <!-- JSON DATA LOADING FOR PAGE -->
    <script></script>
  </body>
</html>
